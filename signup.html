<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockFlow Signup</title>

  <script>
    (function () {
      const savedTheme = localStorage.getItem("theme");
      if (savedTheme === "light") {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <button class="theme-toggle" id="themeToggle">
    <span class="theme-toggle__label">🌙</span>
  </button>

  <main class="card card--wide">
    <div class="logo">S</div>

    <h1>Create Account</h1>
    <p class="subtitle">Join StockFlow to manage inventory</p>

    <form class="auth-form" id="signupForm">
      <div class="input-group">
        <label>Full Name</label>
        <input id="fullName" type="text">
        <p class="field-error" id="fullNameError"></p>
      </div>

      <div class="input-group">
        <label>Email</label>
        <input id="signupEmail" type="email">
        <p class="field-error" id="signupEmailError"></p>
      </div>

      <div class="input-group">
        <label>Password</label>
        <input id="signupPassword" type="password">
        <p class="field-error" id="signupPasswordError"></p>
      </div>

      <div class="input-group">
        <label>Confirm Password</label>
        <input id="confirmPassword" type="password">
        <p class="field-error" id="confirmPasswordError"></p>
      </div>

      <p class="form-message" id="formMessage"></p>

      <button class="primary-button">Create Account →</button>
    </form>

    <p class="auth-switch">
      Already have an account? <a href="login.html">Sign In</a>
    </p>
  </main>
</div>

<script src="script.js"></script>
</body>
</html>
