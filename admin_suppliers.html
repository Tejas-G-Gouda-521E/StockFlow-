<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockFlow Admin Suppliers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin_dashboard.css">
</head>
<body>
    <div class="dashboard-shell">
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <div class="brand__mark">SF</div>
                <div>
                    <p class="brand__eyebrow">Inventory Suite</p>
                    <h1 class="brand__name">StockFlow</h1>
                </div>
            </div>

            <nav class="sidebar__nav" aria-label="Primary navigation">
                <a class="nav-link" href="Admin_dashboard.html" id="dashboardNavLink">
                    <span class="nav-link__icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3zm10 8h8V11h-8zM3 21h8v-6H3zm10-10h8V3h-8z"/></svg>
                    </span>
                    <span>Dashboard</span>
                </a>
                <a class="nav-link" href="admin_shop.html" id="shopNavLink">
                    <span class="nav-link__icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5h11A2.5 2.5 0 0 1 20 7.5v9a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5zm2.5-.5a.5.5 0 0 0-.5.5V10h12V7.5a.5.5 0 0 0-.5-.5zM6 12v4.5a.5.5 0 0 0 .5.5h11a.5.5 0 0 0 .5-.5V12z"/></svg>
                    </span>
                    <span>Shop</span>
                </a>
                <a class="nav-link" href="admin_orders.html" id="ordersNavLink">
                    <span class="nav-link__icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24"><path d="M7 4h10l1 2h3v2h-1l-1.7 7.1A3 3 0 0 1 15.4 18H9a3 3 0 0 1-2.9-2.3L4.2 8H3V6h3zm1.3 4 1.4 5.4a1 1 0 0 0 1 .8h4.7a1 1 0 0 0 1-.8L17.8 8zM9 20a1.5 1.5 0 1 0 0 .01zm7 0a1.5 1.5 0 1 0 0 .01z"/></svg>
                    </span>
                    <span>Orders</span>
                </a>
                <a class="nav-link" href="admin_suppliers.html" id="suppliersNavLink">
                    <span class="nav-link__icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4m-7 8v-1a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v1zm12.5-8.5A2.5 2.5 0 1 0 15 9a2.5 2.5 0 0 0 2.5 2.5M19 20v-1a4.9 4.9 0 0 0-1.2-3.2A4 4 0 0 1 21 19v1z"/></svg>
                    </span>
                    <span>Suppliers</span>
                </a>
            </nav>

            <section class="profile-card" id="adminProfileCard" aria-label="Admin profile" role="button" tabindex="0">
                <div class="profile-card__avatar" id="adminSidebarAvatar" aria-hidden="true">
                    <span id="adminSidebarAvatarLetter">A</span>
                </div>
                <div class="profile-card__body">
                    <h2 id="adminSidebarName">Admin</h2>
                    <p id="adminSidebarMeta">admin@gmail.com</p>
                </div>
                <button class="profile-card__button" id="adminViewProfileButton" type="button">View Profile</button>
            </section>
        </aside>

        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <main class="main-content">
            <header class="topbar">
                <div class="topbar__left">
                    <button class="menu-toggle" id="menuToggle" type="button" aria-label="Toggle navigation">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
                    <div>
                        <p class="topbar__eyebrow">Partners</p>
                        <h2 class="topbar__title">Suppliers</h2>
                    </div>
                </div>

                <div class="topbar__actions">
                    <span class="role-badge">Admin</span>
                    <button class="logout-button" type="button">Logout</button>
                </div>
            </header>

            <section class="suppliers-section reveal-section" aria-labelledby="suppliersPageTitle">
                <article class="panel-card suppliers-add-card">
                    <div class="panel-card__header">
                        <div>
                            <p class="panel-card__eyebrow">Partners</p>
                            <h3 id="suppliersPageTitle">Suppliers</h3>
                        </div>
                    </div>

                    <form class="suppliers-form" id="suppliersForm" novalidate>
                        <label class="inventory-search suppliers-form__field">
                            <span class="sr-only">Supplier name</span>
                            <input
                                type="text"
                                id="supplierNameInput"
                                placeholder="Enter supplier name"
                                autocomplete="off"
                            >
                        </label>
                        <button class="inventory-button inventory-button--primary suppliers-form__button" type="submit">
                            + Add Supplier
                        </button>
                    </form>

                    <p class="suppliers-feedback suppliers-feedback--error" id="supplierErrorMessage" role="alert" hidden></p>
                    <p class="suppliers-feedback suppliers-feedback--success" id="supplierSuccessMessage" aria-live="polite" hidden></p>
                </article>

                <article class="panel-card suppliers-list-card">
                    <div class="suppliers-toolbar">
                        <div>
                            <p class="panel-card__eyebrow">Directory</p>
                            <h3>Suppliers List</h3>
                        </div>
                        <label class="inventory-search suppliers-search">
                            <span class="sr-only">Search suppliers</span>
                            <input
                                type="search"
                                id="supplierSearchInput"
                                placeholder="Search suppliers..."
                                autocomplete="off"
                            >
                        </label>
                    </div>

                    <div class="suppliers-empty-state" id="suppliersEmptyState" hidden>
                        <span class="suppliers-empty-state__icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24"><path d="M12 3a4 4 0 1 1-4 4 4 4 0 0 1 4-4m0 10c4.42 0 8 1.79 8 4v2H4v-2c0-2.21 3.58-4 8-4"/></svg>
                        </span>
                        <p id="suppliersEmptyMessage">No suppliers added yet</p>
                    </div>

                    <div class="suppliers-list" id="suppliersList" aria-live="polite"></div>
                </article>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
